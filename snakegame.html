<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>스네이크 게임</title>
    <script src="assets/theme.js"></script>
    <style>
      :root {
        --bg: #f3f1e8;
        --board: #e4e8d6;
        --grid: #d5dac3;
        --ink: #1f2a1c;
        --snake: #2f6b3a;
        --head: #1c4a26;
        --food: #d6452f;
        --muted: #5d6a58;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #11160f;
          --board: #1a2217;
          --grid: #212b1d;
          --ink: #e6ecdc;
          --snake: #7fcf8a;
          --head: #b6f0bd;
          --food: #ff6a52;
          --muted: #8c9b85;
        }
      }
      :root[data-theme="dark"] {
        --bg: #11160f;
        --board: #1a2217;
        --grid: #212b1d;
        --ink: #e6ecdc;
        --snake: #7fcf8a;
        --head: #b6f0bd;
        --food: #ff6a52;
        --muted: #8c9b85;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
        height: 100%;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        height: auto;
        padding: 18px 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
      }
      .wrap {
        width: min(92vw, 440px);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0;
        font-weight: 700;
      }
      .score {
        font-size: 1rem;
        color: var(--muted);
      }
      .score b {
        color: var(--ink);
        font-size: 1.3rem;
      }
      .stage {
        position: relative;
      }
      canvas {
        width: 100%;
        aspect-ratio: 1;
        display: block;
        background: var(--board);
        border-radius: 10px;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        border-radius: 10px;
        text-align: center;
        padding: 16px;
      }
      .overlay.hide {
        display: none;
      }
      .overlay p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .overlay h2 {
        margin: 0;
        font-size: 1.4rem;
      }
      button {
        min-height: 44px;
        font: inherit;
        background: var(--snake);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        padding: 10px 22px;
        cursor: pointer;
        font-weight: 700;
      }
      button:focus-visible {
        outline: 3px solid var(--food);
        outline-offset: 2px;
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(2, 52px);
        gap: 6px;
        justify-content: center;
      }
      .pad button {
        padding: 0;
        font-size: 1.2rem;
        background: var(--grid);
        color: var(--ink);
      }
      .pad .u {
        grid-column: 2;
        grid-row: 1;
      }
      .pad .l {
        grid-column: 1;
        grid-row: 2;
      }
      .pad .d {
        grid-column: 2;
        grid-row: 2;
      }
      .pad .r {
        grid-column: 3;
        grid-row: 2;
      }
      @media (hover: hover) and (pointer: fine) {
        .pad {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
        "
      >
        <a
          href="index.html?resume=1"
          style="color: var(--muted); font-size: 0.85rem; text-decoration: none"
          >← 전체 놀이터</a
        ><label
          style="
            font-size: 0.8rem;
            display: flex;
            gap: 8px;
            align-items: center;
          "
          >화면<select
            id="theme"
            aria-label="화면 테마"
            style="
              font: inherit;
              color: inherit;
              background: transparent;
              border: 1px solid currentColor;
              border-radius: 8px;
              padding: 8px;
            "
          >
            <option value="auto">◐ 자동</option>
            <option value="light">☀ 밝게</option>
            <option value="dark">☾ 어둡게</option>
          </select></label
        >
      </div>
      <div class="top">
        <h1>스네이크</h1>
        <div class="score">
          점수 <b id="score">0</b> · 최고 <b id="best">0</b>
        </div>
      </div>
      <div class="stage">
        <canvas
          aria-label="스네이크 게임 보드"
          role="img"
          style="touch-action: none"
          id="c"
          width="400"
          height="400"
        ></canvas>
        <div class="overlay" id="ov">
          <h2 id="ovTitle">스네이크 게임</h2>
          <p id="ovMsg">
            방향키 또는 WASD로 움직이세요.<br />스페이스바로 일시정지.
          </p>
          <button id="start">시작하기</button>
        </div>
      </div>
      <button id="pause" disabled>일시정지</button>
      <div class="pad">
        <button class="u" data-d="U" aria-label="위">▲</button>
        <button class="l" data-d="L" aria-label="왼쪽">◀</button>
        <button class="d" data-d="D" aria-label="아래">▼</button>
        <button class="r" data-d="R" aria-label="오른쪽">▶</button>
      </div>
    </div>
    <script>
      (() => {
        const N = 20,
          S = 20;
        const cv = document.getElementById("c"),
          cx = cv.getContext("2d");
        const ov = document.getElementById("ov"),
          ovTitle = document.getElementById("ovTitle"),
          ovMsg = document.getElementById("ovMsg");
        const scoreEl = document.getElementById("score"),
          bestEl = document.getElementById("best");
        const startButton = document.getElementById("start"),
          pauseButton = document.getElementById("pause");
        const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
        let snake,
          dir,
          next,
          food,
          score,
          timer,
          running = false,
          paused = false,
          best = 0;
        try {
          best = Number(localStorage.getItem("snakeBest")) || 0;
        } catch {}
        bestEl.textContent = best;
        const css = (n) =>
          getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        function placeFood() {
          const free = [];
          for (let y = 0; y < N; y++)
            for (let x = 0; x < N; x++)
              if (!snake.some((s) => s[0] === x && s[1] === y))
                free.push([x, y]);
          food = free.length
            ? free[Math.floor(Math.random() * free.length)]
            : null;
        }
        function reset() {
          snake = [
            [10, 10],
            [9, 10],
            [8, 10],
          ];
          dir = next = "R";
          score = 0;
          scoreEl.textContent = 0;
          placeFood();
        }
        function loop() {
          clearTimeout(timer);
          if (running && !paused)
            timer = setTimeout(
              () => {
                step();
                loop();
              },
              Math.max(60, 130 - score * 3),
            );
        }
        function step() {
          dir = next;
          const [dx, dy] = DIR[dir],
            h = [snake[0][0] + dx, snake[0][1] + dy];
          const eats = food && h[0] === food[0] && h[1] === food[1];
          // The tail moves out of the way on a normal step.
          const body = eats ? snake : snake.slice(0, -1);
          if (
            h[0] < 0 ||
            h[1] < 0 ||
            h[0] >= N ||
            h[1] >= N ||
            body.some((s) => s[0] === h[0] && s[1] === h[1])
          )
            return over(false);
          snake.unshift(h);
          if (eats) {
            score++;
            scoreEl.textContent = score;
            if (score > best) {
              best = score;
              bestEl.textContent = best;
              try {
                localStorage.setItem("snakeBest", String(best));
              } catch {}
            }
            placeFood();
          } else snake.pop();
          draw();
          if (!food) over(true);
        }
        function over(won) {
          running = false;
          paused = false;
          clearTimeout(timer);
          pauseButton.disabled = true;
          pauseButton.textContent = "일시정지";
          ovTitle.textContent = won ? "모든 칸을 채웠어요! 🎉" : "게임 오버";
          ovMsg.textContent = `점수 ${score}점`;
          startButton.textContent = "다시 하기";
          ov.classList.remove("hide");
        }
        function draw() {
          cx.clearRect(0, 0, 400, 400);
          cx.fillStyle = css("--grid");
          for (let x = 0; x < N; x++)
            for (let y = 0; y < N; y++)
              if ((x + y) % 2) cx.fillRect(x * S, y * S, S, S);
          if (food) {
            cx.fillStyle = css("--food");
            cx.beginPath();
            cx.arc(food[0] * S + S / 2, food[1] * S + S / 2, S / 2 - 3, 0, 7);
            cx.fill();
          }
          snake.forEach((s, i) => {
            cx.fillStyle = css(i ? "--snake" : "--head");
            cx.beginPath();
            cx.roundRect(s[0] * S + 1, s[1] * S + 1, S - 2, S - 2, i ? 5 : 7);
            cx.fill();
          });
        }
        function start() {
          reset();
          paused = false;
          running = true;
          pauseButton.disabled = false;
          pauseButton.textContent = "일시정지";
          ov.classList.add("hide");
          draw();
          loop();
        }
        function pause(value = !paused) {
          if (!running) return;
          paused = value;
          clearTimeout(timer);
          pauseButton.textContent = paused ? "계속하기" : "일시정지";
          ovTitle.textContent = "일시정지";
          ovMsg.textContent = "계속하기 버튼 또는 스페이스바로 이어가세요.";
          startButton.textContent = "계속하기";
          ov.classList.toggle("hide", !paused);
          if (!paused) loop();
        }
        function turn(d) {
          const opp = { U: "D", D: "U", L: "R", R: "L" };
          if (running && !paused && next === dir && d !== opp[dir]) next = d;
        }
        startButton.onclick = () => (paused ? pause(false) : start());
        pauseButton.onclick = () => pause();
        document.addEventListener("keydown", (e) => {
          if (
            e.ctrlKey ||
            e.metaKey ||
            e.altKey ||
            e.target.tagName === "SELECT"
          )
            return;
          const k = {
            ArrowUp: "U",
            ArrowDown: "D",
            ArrowLeft: "L",
            ArrowRight: "R",
            w: "U",
            s: "D",
            a: "L",
            d: "R",
          }[e.key];
          if (k) {
            e.preventDefault();
            turn(k);
          } else if (e.code === "Space") {
            e.preventDefault();
            if (e.repeat) return;
            if (!running) start();
            else pause();
          }
        });
        document
          .querySelectorAll(".pad button")
          .forEach((b) => (b.onclick = () => turn(b.dataset.d)));
        let touch;
        cv.onpointerdown = (e) => {
          touch = [e.clientX, e.clientY];
          cv.setPointerCapture(e.pointerId);
        };
        cv.onpointerup = (e) => {
          if (!touch) return;
          const dx = e.clientX - touch[0],
            dy = e.clientY - touch[1];
          touch = null;
          if (Math.max(Math.abs(dx), Math.abs(dy)) >= 20)
            turn(
              Math.abs(dx) > Math.abs(dy)
                ? dx > 0
                  ? "R"
                  : "L"
                : dy > 0
                  ? "D"
                  : "U",
            );
        };
        cv.onpointercancel = () => (touch = null);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden && running && !paused) pause(true);
        });
        document.addEventListener("themechange", () => {
          if (snake) draw();
        });
        reset();
        draw();
      })();
    </script>
  </body>
</html>
