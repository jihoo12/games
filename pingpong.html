<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>핑퐁</title>
    <script src="assets/theme.js"></script>
    <style>
      :root {
        --bg: #f4f1ea;
        --fg: #1f2430;
        --court: #fffdf8;
        --line: #c9c3b6;
        --accent: #bd431f;
        --button-ink: #fff;
        --blue: #2e6ee4;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14161c;
          --fg: #eceae4;
          --court: #1d2029;
          --line: #3a3f4d;
          --accent: #ff7a50;
          --button-ink: #251b13;
          --blue: #6fa0ff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14161c;
        --fg: #eceae4;
        --court: #1d2029;
        --line: #3a3f4d;
        --accent: #ff7a50;
        --button-ink: #251b13;
        --blue: #6fa0ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        min-height: 100svh;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Apple SD Gothic Neo",
          "Noto Sans KR",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.3rem;
        letter-spacing: 0.1em;
      }
      .wrap {
        position: relative;
        width: 100%;
        max-width: 720px;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        background: var(--court);
        border: 2px solid var(--line);
        border-radius: 12px;
        touch-action: none;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        background: color-mix(in srgb, var(--court) 80%, transparent);
        border-radius: 12px;
      }
      .overlay.hide {
        display: none;
      }
      .overlay h2 {
        margin: 0;
        font-size: 1.6rem;
      }
      button {
        min-height: 44px;
        font: inherit;
        font-weight: 600;
        padding: 10px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--button-ink);
        cursor: pointer;
      }
      p {
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.75;
        text-align: center;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <nav
      style="
        width: min(100%, 720px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      "
    >
      <a
        href="index.html?resume=1"
        style="color: var(--fg); font-size: 0.85rem; text-decoration: none"
        >← 전체 놀이터</a
      ><label
        style="font-size: 0.8rem; display: flex; gap: 8px; align-items: center"
        >화면<select
          id="theme"
          aria-label="화면 테마"
          style="
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid currentColor;
            border-radius: 8px;
            padding: 8px;
          "
        >
          <option value="auto">◐ 자동</option>
          <option value="light">☀ 밝게</option>
          <option value="dark">☾ 어둡게</option>
        </select></label
      >
    </nav>
    <h1>PING PONG</h1>
    <div class="wrap">
      <canvas
        aria-label="컴퓨터와 대전하는 핑퐁 보드"
        role="img"
        id="c"
        width="720"
        height="440"
      ></canvas>
      <div class="overlay" id="ov">
        <h2 id="t">핑퐁</h2>
        <p id="s">먼저 7점을 얻으면 승리!</p>
        <button id="b">시작하기</button>
      </div>
    </div>
    <button id="pause" disabled>일시정지</button>
    <p>
      마우스·터치 드래그 또는 ↑ ↓ / W S 키로 왼쪽 패들을 움직이세요.
      스페이스바로 일시정지.
    </p>
    <script>
      const cv = document.getElementById("c"),
        ctx = cv.getContext("2d");
      const W = cv.width,
        H = cv.height,
        PW = 12,
        PH = 80,
        R = 8,
        WIN = 7;
      const ov = document.getElementById("ov"),
        t = document.getElementById("t"),
        s = document.getElementById("s"),
        b = document.getElementById("b");
      let py,
        ay,
        bx,
        by,
        vx,
        vy,
        ps,
        as,
        running = false,
        over = false,
        keys = {},
        started = false;
      function css(n) {
        return getComputedStyle(document.documentElement)
          .getPropertyValue(n)
          .trim();
      }
      function serve(dir) {
        bx = W / 2;
        by = H / 2;
        const a = Math.random() * 0.8 - 0.4;
        const sp = 5;
        vx = dir * sp * Math.cos(a);
        vy = sp * Math.sin(a);
      }
      function reset() {
        py = ay = H / 2 - PH / 2;
        ps = as = 0;
        over = false;
        serve(Math.random() < 0.5 ? 1 : -1);
      }
      function start() {
        reset();
        started = true;
        running = true;
        b.textContent = "다시 하기";
        document.getElementById("pause").disabled = false;
        document.getElementById("pause").textContent = "일시정지";
        b.onclick = start;
        ov.classList.add("hide");
      }
      b.onclick = start;
      function pause() {
        if (!started || over) return;
        running = !running;
        document.getElementById("pause").textContent = running
          ? "일시정지"
          : "계속하기";
        if (running) {
          ov.classList.add("hide");
          b.onclick = start;
        } else {
          t.textContent = "일시정지";
          s.textContent = "계속하기 버튼 또는 스페이스바로 이어가세요.";
          b.textContent = "계속하기";
          b.onclick = pause;
          ov.classList.remove("hide");
        }
      }
      document.getElementById("pause").onclick = pause;
      addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey || e.target.tagName === "SELECT")
          return;
        const key = e.key.toLowerCase();
        keys[key] = 1;
        if (["arrowup", "arrowdown", "w", "s"].includes(key))
          e.preventDefault();
        if (e.code === "Space") {
          e.preventDefault();
          if (e.repeat) return;
          if (over || !started) start();
          else pause();
        }
      });
      addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = 0));
      addEventListener("blur", () => {
        keys = {};
        if (running) pause();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && running) {
          keys = {};
          pause();
        }
      });
      function moveTo(cy) {
        const r = cv.getBoundingClientRect();
        const y = ((cy - r.top) * H) / r.height;
        py = Math.max(0, Math.min(H - PH, y - PH / 2));
      }
      cv.addEventListener("pointermove", (e) => moveTo(e.clientY));
      cv.addEventListener("pointerdown", (e) => {
        cv.setPointerCapture(e.pointerId);
        moveTo(e.clientY);
      });
      function end(win) {
        running = false;
        over = true;
        document.getElementById("pause").disabled = true;
        t.textContent = win ? "승리! 🎉" : "패배…";
        s.textContent = ps + " : " + as;
        b.textContent = "다시 하기";
        b.onclick = start;
        ov.classList.remove("hide");
      }
      function update() {
        if (keys["arrowup"] || keys["w"]) py -= 7;
        if (keys["arrowdown"] || keys["s"]) py += 7;
        py = Math.max(0, Math.min(H - PH, py));
        // AI
        const target = by - PH / 2,
          d = target - ay,
          maxs = 4.2;
        if (vx > 0 || Math.abs(bx - W) < W / 2)
          ay += Math.max(-maxs, Math.min(maxs, d));
        ay = Math.max(0, Math.min(H - PH, ay));
        bx += vx;
        by += vy;
        if (by < R) {
          by = R;
          vy = -vy;
        }
        if (by > H - R) {
          by = H - R;
          vy = -vy;
        }
        // left paddle
        if (
          vx < 0 &&
          bx - R <= 20 + PW &&
          bx - R >= 10 &&
          by > py - R &&
          by < py + PH + R
        ) {
          const h = (by - (py + PH / 2)) / (PH / 2);
          const sp = Math.min(Math.hypot(vx, vy) * 1.06, 13);
          const a = (h * Math.PI) / 3.2;
          vx = sp * Math.cos(a);
          vy = sp * Math.sin(a);
          bx = 20 + PW + R;
        }
        // right paddle
        if (
          vx > 0 &&
          bx + R >= W - 20 - PW &&
          bx + R <= W - 10 &&
          by > ay - R &&
          by < ay + PH + R
        ) {
          const h = (by - (ay + PH / 2)) / (PH / 2);
          const sp = Math.min(Math.hypot(vx, vy) * 1.06, 13);
          const a = (h * Math.PI) / 3.2;
          vx = -sp * Math.cos(a);
          vy = sp * Math.sin(a);
          bx = W - 20 - PW - R;
        }
        if (bx < -R) {
          as++;
          if (as >= WIN) return end(false);
          serve(1);
        }
        if (bx > W + R) {
          ps++;
          if (ps >= WIN) return end(true);
          serve(-1);
        }
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.strokeStyle = css("--line");
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 12]);
        ctx.beginPath();
        ctx.moveTo(W / 2, 0);
        ctx.lineTo(W / 2, H);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = css("--fg");
        ctx.globalAlpha = 0.35;
        ctx.font = "bold 56px system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(ps || 0, W / 2 - 70, 70);
        ctx.fillText(as || 0, W / 2 + 70, 70);
        ctx.globalAlpha = 1;
        if (py === undefined) return;
        ctx.fillStyle = css("--blue");
        ctx.beginPath();
        ctx.roundRect(20, py, PW, PH, 6);
        ctx.fill();
        ctx.fillStyle = css("--fg");
        ctx.beginPath();
        ctx.roundRect(W - 20 - PW, ay, PW, PH, 6);
        ctx.fill();
        ctx.fillStyle = css("--accent");
        ctx.beginPath();
        ctx.arc(bx, by, R, 0, 7);
        ctx.fill();
      }
      let last = 0,
        accumulator = 0;
      function loop(time) {
        const delta = last ? Math.min(time - last, 100) : 0;
        last = time;
        if (running) {
          accumulator += delta;
          while (accumulator >= 1000 / 60 && running) {
            update();
            accumulator -= 1000 / 60;
          }
        } else accumulator = 0;
        draw();
        requestAnimationFrame(loop);
      }
      reset();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
